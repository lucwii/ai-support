name: CI/CD Pipeline

# ──────────────────────────────────────────────────────────────────────────────
# Kada se pokrece:
#   - Svaki push na main granu
#   - Svaki pull request koji cilja main granu
# ──────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

# ──────────────────────────────────────────────────────────────────────────────
# POSAO 1: Build & lint backend (NestJS)
# ──────────────────────────────────────────────────────────────────────────────
jobs:
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout koda
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instaliraj zavisnosti
        working-directory: backend
        run: npm ci

      - name: TypeScript kompajliranje (build)
        working-directory: backend
        env:
          PORT: 3001
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_EMBEDDING_MODEL: ${{ secrets.OPENAI_EMBEDDING_MODEL }}
          OPENAI_CHAT_MODEL: ${{ secrets.OPENAI_CHAT_MODEL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          LEMON_SQUEEZY_API_KEY: ${{ secrets.LEMON_SQUEEZY_API_KEY }}
          LEMON_SQUEEZY_STORE_ID: ${{ secrets.LEMON_SQUEEZY_STORE_ID }}
          LEMON_SQUEEZY_WEBHOOK_SECRET: ${{ secrets.LEMON_SQUEEZY_WEBHOOK_SECRET }}
          LEMON_SQUEEZY_VARIANT_STARTER: ${{ secrets.LEMON_SQUEEZY_VARIANT_STARTER }}
          LEMON_SQUEEZY_VARIANT_PRO: ${{ secrets.LEMON_SQUEEZY_VARIANT_PRO }}
          FRONTEND_URL: http://localhost:3000
        run: npm run build


# ──────────────────────────────────────────────────────────────────────────────
# POSAO 2: Build frontend (Next.js)
# ──────────────────────────────────────────────────────────────────────────────
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout koda
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instaliraj zavisnosti
        working-directory: frontend
        run: npm ci

      - name: Next.js build
        working-directory: frontend
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_API_URL: http://localhost:3001
        run: npm run build


# ──────────────────────────────────────────────────────────────────────────────
# POSAO 3: Deploy (samo na push na main, ne i na PR)
# ──────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout koda
        uses: actions/checkout@v4

      # ── BACKEND DEPLOY ───────────────────────────────────────────────────────
      # Zamijeni ovu sekciju sa svojim deployment provajderom
      # Primjeri: Railway, Render, Fly.io, AWS ECS, DigitalOcean App Platform
      - name: Deploy backend
        run: |
          echo "Ovdje ide tvoj backend deploy komanda"
          echo "Primjer za Railway: railway up --service backend"
          echo "Primjer za Render:  curl -X POST ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}"

      # ── FRONTEND DEPLOY ──────────────────────────────────────────────────────
      # Ako koristis Vercel, preporucuje se Vercel GitHub integracija umjesto ovog
      # Ako koristis nesto drugo (Netlify, Railway, itd.) - zamijeni ovo
      - name: Deploy frontend
        run: |
          echo "Ovdje ide tvoj frontend deploy komanda"
          echo "Primjer za Vercel: vercel --prod --token ${{ secrets.VERCEL_TOKEN }}"
