name: CI/CD Pipeline

# ──────────────────────────────────────────────────────────────────────────────
# Kada se pokrece:
#   - Svaki push na main granu
#   - Svaki pull request koji cilja main granu
# ──────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  DOTNET_VERSION: '10.0'

# ──────────────────────────────────────────────────────────────────────────────
# POSAO 1: Build & lint backend (NestJS)
# ──────────────────────────────────────────────────────────────────────────────
jobs:
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout koda
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instaliraj zavisnosti
        working-directory: backend
        run: npm ci

      - name: TypeScript kompajliranje (build)
        working-directory: backend
        env:
          PORT: 3001
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_EMBEDDING_MODEL: ${{ secrets.OPENAI_EMBEDDING_MODEL }}
          OPENAI_CHAT_MODEL: ${{ secrets.OPENAI_CHAT_MODEL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          LEMON_SQUEEZY_API_KEY: ${{ secrets.LEMON_SQUEEZY_API_KEY }}
          LEMON_SQUEEZY_STORE_ID: ${{ secrets.LEMON_SQUEEZY_STORE_ID }}
          LEMON_SQUEEZY_WEBHOOK_SECRET: ${{ secrets.LEMON_SQUEEZY_WEBHOOK_SECRET }}
          LEMON_SQUEEZY_VARIANT_STARTER: ${{ secrets.LEMON_SQUEEZY_VARIANT_STARTER }}
          LEMON_SQUEEZY_VARIANT_PRO: ${{ secrets.LEMON_SQUEEZY_VARIANT_PRO }}
          FRONTEND_URL: http://localhost:3000
        run: npm run build

      # Sacuvaj build artifakt da ga selenium-tests job preuzme
      - name: Upload backend build
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: backend/dist
          retention-days: 1

# ──────────────────────────────────────────────────────────────────────────────
# POSAO 2: Build frontend (Next.js)
# ──────────────────────────────────────────────────────────────────────────────
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout koda
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instaliraj zavisnosti
        working-directory: frontend
        run: npm ci

      - name: Next.js build
        working-directory: frontend
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_API_URL: http://localhost:3001
        run: npm run build

      # Sacuvaj .next folder da ga selenium-tests job preuzme
      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/.next
          retention-days: 1
          if-no-files-found: error

# ──────────────────────────────────────────────────────────────────────────────
# POSAO 3: Selenium E2E testovi
# Pokrece se tek kad oba build-a uspiju (needs: [...])
# ──────────────────────────────────────────────────────────────────────────────
  selenium-tests:
    name: Selenium E2E Tests
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]

    steps:
      - name: Checkout koda
        uses: actions/checkout@v4

      # ── Node za pokretanje servera ──────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # ── .NET za Selenium testove ────────────────────────────────────────────
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # ── Chrome (headless) ────────────────────────────────────────────────────
      - name: Setup Chrome browser
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      # ── Preuzmi build artifakte iz prethodnih jobova ────────────────────────
      - name: Download backend build
        uses: actions/download-artifact@v4
        with:
          name: backend-dist
          path: backend/dist

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend/.next

      # ── Instaliraj node_modules (potrebno za pokretanje servera) ────────────
      - name: Instaliraj backend zavisnosti
        working-directory: backend
        run: npm ci

      - name: Instaliraj frontend zavisnosti
        working-directory: frontend
        run: npm ci

      # ── Pokreni backend u pozadini ──────────────────────────────────────────
      - name: Pokreni backend server
        working-directory: backend
        env:
          PORT: 3001
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_EMBEDDING_MODEL: ${{ secrets.OPENAI_EMBEDDING_MODEL }}
          OPENAI_CHAT_MODEL: ${{ secrets.OPENAI_CHAT_MODEL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          LEMON_SQUEEZY_API_KEY: ${{ secrets.LEMON_SQUEEZY_API_KEY }}
          LEMON_SQUEEZY_STORE_ID: ${{ secrets.LEMON_SQUEEZY_STORE_ID }}
          LEMON_SQUEEZY_WEBHOOK_SECRET: ${{ secrets.LEMON_SQUEEZY_WEBHOOK_SECRET }}
          LEMON_SQUEEZY_VARIANT_STARTER: ${{ secrets.LEMON_SQUEEZY_VARIANT_STARTER }}
          LEMON_SQUEEZY_VARIANT_PRO: ${{ secrets.LEMON_SQUEEZY_VARIANT_PRO }}
          FRONTEND_URL: http://localhost:3000
        run: npm run start:prod &

      # ── Pokreni frontend u pozadini ─────────────────────────────────────────
      - name: Pokreni frontend server
        working-directory: frontend
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_API_URL: http://localhost:3001
          PORT: 3000
        run: npm run start &

      # ── Cekaj dok serveri ne budu spremni ───────────────────────────────────
      # wait-on svakih 250ms pinga URL dok ne dobije 200 odgovor (timeout 90s)
      - name: Cekaj backend (port 3001)
        run: npx wait-on http://localhost:3001 --timeout 90000 --interval 500

      - name: Cekaj frontend (port 3000)
        run: npx wait-on http://localhost:3000 --timeout 90000 --interval 500

      # ── Pokreni Selenium testove ─────────────────────────────────────────────
      - name: Restore NuGet paketi
        working-directory: automated-tests/automated-tests
        run: dotnet restore

      - name: Pokreni Selenium testove
        working-directory: automated-tests/automated-tests
        env:
          CI: true
        run: dotnet test --logger "console;verbosity=detailed" --results-directory ./TestResults

      # ── Sacuvaj test report (uvijek, cak i kad testovi padnu) ───────────────
      - name: Upload test rezultati
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-test-results
          path: automated-tests/automated-tests/TestResults
          retention-days: 7

# ──────────────────────────────────────────────────────────────────────────────
# POSAO 4: Deploy (samo na push na main, ne i na PR)
# Ovaj job se pokrece tek kad svi testovi prodju
# ──────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [selenium-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout koda
        uses: actions/checkout@v4

      # ── BACKEND DEPLOY ───────────────────────────────────────────────────────
      # Zamijeni ovu sekciju sa svojim deployment provajderom
      # Primjeri: Railway, Render, Fly.io, AWS ECS, DigitalOcean App Platform
      - name: Deploy backend
        run: |
          echo "Ovdje ide tvoj backend deploy komanda"
          echo "Primjer za Railway: railway up --service backend"
          echo "Primjer za Render:  curl -X POST ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}"

      # ── FRONTEND DEPLOY ──────────────────────────────────────────────────────
      # Ako koristis Vercel, preporucuje se Vercel GitHub integracija umjesto ovog
      # Ako koristis nesto drugo (Netlify, Railway, itd.) - zamijeni ovo
      - name: Deploy frontend
        run: |
          echo "Ovdje ide tvoj frontend deploy komanda"
          echo "Primjer za Vercel: vercel --prod --token ${{ secrets.VERCEL_TOKEN }}"
